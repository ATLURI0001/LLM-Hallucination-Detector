name: CI / Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Audit
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go-version: [ '1.22.x', '1.23.x' ]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Run Go Vet
      run: go vet ./...

    - name: Run Unit Tests
      run: go test -v -race ./...

    - name: Build hallucidetect executable
      run: go build -v -o hallucidetect ./cmd/hallucidetect

    - name: Run Benchmark Verification
      run: ./hallucidetect benchmark

  release-build:
    name: Cross-Platform Build
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'

    - name: Build Linux amd64
      run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/hallucidetect-linux-amd64 ./cmd/hallucidetect

    - name: Build Linux arm64
      run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/hallucidetect-linux-arm64 ./cmd/hallucidetect

    - name: Build macOS amd64
      run: GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/hallucidetect-darwin-amd64 ./cmd/hallucidetect

    - name: Build macOS arm64 (Apple Silicon)
      run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/hallucidetect-darwin-arm64 ./cmd/hallucidetect

    - name: Build Windows amd64
      run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/hallucidetect-windows-amd64.exe ./cmd/hallucidetect

    - name: Upload Binaries Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hallucidetect-binaries
        path: dist/
