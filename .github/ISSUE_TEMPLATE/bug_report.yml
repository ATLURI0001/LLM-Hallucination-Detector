name: 🐛 Bug Report
description: File a bug report to help us improve VeriFact
title: "[BUG] <concise description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the input source text, AI answer, and command/API payload used.
      placeholder: |
        1. Run hallucidetect check -s "..." -a "..."
        2. Notice unexpected status for claim #X
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Go 1.23, Windows 11 / Linux x86_64, Docker
    validations:
      required: false
